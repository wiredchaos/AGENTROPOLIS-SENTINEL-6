sentinel:
  version: "0.3.0"
  mode: closed-loop
  commander: hermes
  source_of_truth: evidence

engines:
  cartographer:
    id: S1
    role: system-census
  conservator:
    id: S2
    role: invariant-verification
  breaker:
    id: S3
    role: adversarial-falsification
  ledger:
    id: S4
    role: custody-authority-accounting
  pressure:
    id: S5
    role: concurrency-failure-recovery
  closure:
    id: S6
    role: coverage-and-stop-authority

governance:
  policy_authority: aegis
  assurance_authority: sentinel-6
  evidence_ledger: audit-ledger
  human_authority: mission-control
  independence:
    aegis_cannot_suppress_evidence: true
    sentinel_cannot_grant_authority: true
    models_cannot_set_policy: true
    tools_cannot_expand_mandate: true
  aegis_feedback:
    enabled: true
    input: evidence-backed-findings
    permitted_postures:
      - allow
      - observe
      - restrict
      - quarantine
      - require-human-approval
    automatic_relaxation: false
    human_override: mission-control

model_policy:
  strategy: differentiated-mandates
  consensus_is_proof: false
  require_evidence: true
  allow_hosted_models: true
  allow_local_models: true
  allow_static_analyzers: true
  allow_mcp_tools: true
  critical_high_cross_review: true

information_diversity:
  enabled: true
  unit: bits
  shannon_entropy: true
  normalized_entropy: true
  effective_reviewer_count: true
  mutual_information: true
  conditional_entropy: true
  information_gain: true
  canonicalize_findings_before_scoring: true
  compare_binary_outcomes_on_same_census_surfaces: true
  record_per_phase: true
  record_per_closure_sweep: true
  low_diversity_action: recommend-different-lens
  authority_effect: none
  severity_effect: none
  aegis_relaxation_effect: none
  closure_gate_alone: false

cognitive_lenses:
  - hyperfocus-depth
  - system-pattern-synthesis
  - literal-ambiguity
  - divergent-novel-path
  - uncertainty-evidence-demand
  - load-loop-retry-drift-state-collapse

severity:
  levels: [critical, high, medium, low]
  track_exposure_separately: true
  track_triggerability_separately: true

execution:
  phase0_read_only: true
  minimum_safe_change: true
  require_regression_validation: true
  require_build_when_available: true
  require_typecheck_when_available: true
  enumerate_consumers_before_commit: true
  adversarial_pass_for: [critical, high]

pressure:
  dimensions:
    - temporal
    - concurrency
    - authority
    - context
    - state
    - economic
    - scale
    - adversarial
  test_retry: true
  test_replay: true
  test_duplicate_execution: true
  test_partial_failure: true
  test_restart_recovery: true

closure:
  queue_must_be_empty: true
  sweeps:
    - entry-points
    - state-and-invariants
    - changed-symbol-consumers
  require_zero_new_findings_each_sweep: true
  require_zero_unexplained_census_gaps: true
  require_zero_introduced_failures: true
  require_authority_corridor_pass: true
  require_receipt_integrity_pass: true
  require_aegis_policy_consistency_pass: true
  inspect_information_diversity: true
  entropy_is_not_independent_closure_proof: true

boundaries:
  deploy: deny
  on_chain_deploy: deny
  destructive_database_actions: deny
  secret_file_inspection: deny
  production_infrastructure_creation: deny
  privilege_broadening: deny
  irreversible_migration: deny
